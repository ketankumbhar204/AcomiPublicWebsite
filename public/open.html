<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Open ACOMI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: sans-serif;
        background: #f4f7f5;
        color: #173024;
      }
      main {
        text-align: center;
        padding: 24px;
      }
      a {
        color: #128c7e;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Opening ACOMI…</p>
      <p><a id="store" href="https://play.google.com/store/apps/details?id=com.acomi&amp;hl=en_IN">Get ACOMI on Google Play</a></p>
    </main>
    <script>
      (function () {
        var play = 'https://play.google.com/store/apps/details?id=com.acomi&hl=en_IN';
        var android = /Android/i.test(navigator.userAgent || '');
        if (!android) {
          location.replace(play);
          return;
        }
        // Launcher intent matches the installed app. Chrome opens the Play Store when it is missing.
        var intent =
          'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.acomi;S.browser_fallback_url=' +
          encodeURIComponent(play) +
          ';end';
        location.href = intent;
        setTimeout(function () {
          if (!document.hidden) {
            location.replace(play);
          }
        }, 1500);
      })();
    </script>
  </body>
</html>
